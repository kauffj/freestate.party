# RETIRED 2026-06-03 — the freestate.party marketing site was folded into the
# fsp-app Next.js app (marketing-merge Stages 1–3) and cut over at nginx: the app
# now serves / /about /business /events /visit /founding (and /saturday) directly.
# This static-site build+deploy pipeline is no longer used. The push / daily-cron /
# events-changed auto-triggers are removed so nothing rsyncs the dead site or reloads
# nginx; the `deploy` job is also guarded with `if: false`. Steps kept for reference.
name: Deploy to freestate.party (RETIRED)

on:
  workflow_dispatch:

jobs:
  deploy:
    if: false  # disabled — static site decommissioned; fsp-app serves these routes (cutover 2026-06-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdown

      - name: Build site
        run: python3 build.py

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 147.182.191.226 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete --exclude="video/" \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/ root@147.182.191.226:/var/www/freestate.party/
          ssh -i ~/.ssh/deploy_key root@147.182.191.226 'nginx -t && systemctl reload nginx'
